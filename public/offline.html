<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline — SureXend</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0A0F1E;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 24px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
    p { color: #94A3B8; font-size: 15px; line-height: 1.6; max-width: 320px; margin-bottom: 32px; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(212, 160, 23, 0.12);
      border: 1px solid rgba(212, 160, 23, 0.3);
      color: #D4A017; padding: 8px 16px; border-radius: 100px;
      font-size: 13px; font-weight: 600; margin-bottom: 32px;
    }
    button {
      background: linear-gradient(135deg, #E8B820, #C49015);
      color: #0D0D0D; border: none; padding: 16px 32px;
      border-radius: 16px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <div class="badge">⚡ No Internet Connection</div>
  <h1>You're Offline</h1>
  <p>
    SureXend needs an internet connection to process transactions and show live rates.
    Please check your connection and try again.
  </p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
